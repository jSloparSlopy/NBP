function nav(){document.getElementById("nav").innerHTML=T.map((t,i)=>`<button class="${i==cur?"on":""}" onclick="cur=${i};draw()">${i+1}. ${t[0]} (${t[1].length})</button>`).join("")}
function score(){let p=0,n=0,a=0,tot=0;T.forEach((t,i)=>t[1].forEach((q,j)=>{tot++;const x=A[i][j];if(x>=0){a++;x==q[2]?p++:n++}}));
document.getElementById("sc").innerHTML=`Odgovoreno ${a}/${tot} · točno ${p} · netočno ${n} · <b>bodovi: ${(p-n*NEG).toFixed(2)}</b>`}
function pick(j,k){if(A[cur][j]<0){A[cur][j]=k;draw()}}
function draw(){nav();score();const e=(s)=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

return `<div class="q"><p class="p">${j+1}. ${e(q[0])}</p>`+q[1].map((o,k)=>`<button class="o ${a>=0?(k==q[2]?"ok":(k==a?"no":"")):""}" ${a>=0?"disabled":""} onclick="pick(${j},${k})">${L[k]}) ${e(o)}</button>`).join("")+(a>=0?`<div class="e">${a==q[2]?"✔ Točno.":"✘ Netočno."} ${e(q[3])}</div>`:"")+"</div>"}).join("")}
function reset(){A=T.map(t=>t[1].map(()=>-1));draw()}
draw();
