const $=s=>document.querySelector(s),app=$("#app");
let sel=new Set(Object.keys(T)),qs=[],i=0,sc=0,wrong=[],done=false;
const sh=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function home(){
 app.innerHTML=`<h1>NBP teorijski kviz</h1><div class="m">${Q.length} pitanja iz predavanja 01–05 (CTE, procedure i funkcije, kontrola toka, kursori i handleri, transakcije)</div>
 <div class="card"><button class="pri" id="go">Počni kviz (sva pitanja, nasumičnim redom)</button><details style="margin-top:12px"><summary class="m">Filtriraj po temama (neobavezno)</summary><div class="chips" style="margin:10px 0">${Object.entries(T).map(([k,v])=>`<button class="chip ${sel.has(k)?"on":""}" data-k="${k}">${v} (${Q.filter(q=>q[0]==k).length})</button>`).join("")}</div></details></div>`;
 app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);home()});
 $("#go").onclick=()=>{if(!sel.size)return;qs=sh(Q.filter(q=>sel.has(q[0])));i=0;sc=0;wrong=[];show()};
}
function show(){
 if(i>=qs.length)return end();
 const q=qs[i],o=sh(q.slice(2).map((t,n)=>({t,c:n==0})));
 app.innerHTML=`<div class="m">${i+1}/${qs.length} · točno: ${sc}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
 <div class="card"><b>${esc(q[1])}</b><div id="os">${o.map((x,n)=>`<button class="opt" data-n="${n}">${esc(x.t)}</button>`).join("")}</div><div id="nx"></div></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const x=o[b.dataset.n];app.querySelectorAll(".opt").forEach((e,n)=>{e.disabled=true;if(o[n].c)e.classList.add("ok")});
  if(x.c)sc++;else{b.classList.add("no");wrong.push(q)}
  $("#nx").innerHTML=`<button class="pri" id="n">${i+1<qs.length?"Sljedeće":"Rezultat"}</button>`;$("#n").onclick=()=>{i++;show()}});
}
function end(){
 const p=Math.round(sc/qs.length*100);
 app.innerHTML=`<h1>Rezultat: ${sc}/${qs.length} (${p}%)</h1><div class="card"><button class="pri" id="r">Novi kviz</button> <button id="w" ${wrong.length?"":"disabled"}>Ponovi samo pogrešne (${wrong.length})</button></div>
 ${wrong.length?`<div class="card"><b>Pogrešno odgovoreno</b>${wrong.map(q=>`<p><span class="m">${esc(q[1])}</span><br>✔ ${esc(q[2])}</p>`).join("")}</div>`:""}`;
 $("#r").onclick=home;$("#w").onclick=()=>{qs=sh(wrong);i=0;sc=0;wrong=[];show()};
}
home();
</script></body></html>
